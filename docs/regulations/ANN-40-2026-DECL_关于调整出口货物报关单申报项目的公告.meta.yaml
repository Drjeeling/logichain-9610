has_attachment: false
note: >-
  官方正文不分条（无"一、二、三"编号），共两段：新增"禁限管制识别码"与"禁限管制申报要素"两个申报项目，
  均为有条件必填项，填制说明指向单一窗口参数查询页。公告本身不含参数表；
  参数落点=单一窗口禁限管制参数（识别码707条/230编码/34识别码 + 申报要素128条/16类，已交付并完成交叉验证）。
  RAG 入库按段落切分，不生成不存在的条款号。
