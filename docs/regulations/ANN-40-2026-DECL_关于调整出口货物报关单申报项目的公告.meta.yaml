id: ANN-40-2026-DECL
title: 关于调整出口货物报关单申报项目的公告
doc_no: 海关总署公告2026年第40号
issuer: 海关总署
publish_date: 2026-04-15
effective_date: 2026-04-15
status: effective
official_url: http://www.customs.gov.cn/customs/2026-04/16/article_2026041610330222871.html
source_channel: 总署官网发布页原件（attachDir .doc 211字 + 同源 .pdf 199字），2026-11-08 交付替换原 12360 问答镜像
